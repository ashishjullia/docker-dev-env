name: Build and Push Docker Image to Docker Hub
on:
  pull_request:
  push:
    branches: [ "main" ]
    tags:
      - 'prod-*'
env:
  REGISTRY: ashishjullia19
  IMAGE_NAME: docker-dev-env
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        driver: docker-container

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        # Pull requests must produce the required "build" check without
        # publishing. Multi-arch builds cannot be loaded into the local
        # Docker engine, so they are cached only until a main/tag push.
        outputs: ${{ github.event_name == 'push' && 'type=registry' || 'type=cacheonly' }}
